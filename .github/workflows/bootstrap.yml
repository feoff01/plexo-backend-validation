name: bootstrap Plexo project

on:
  push:
    branches:
      - bootstrap/plexo-project
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/plexo-project

      - name: validar e extrair pacote Plexo
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="plexo-backend-fq4-integration-gate.zip"
          test -f "$ARCHIVE"

          TMP_DIR="$(mktemp -d)"
          export ARCHIVE TMP_DIR

          python - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          archive = Path(os.environ["ARCHIVE"])
          target = Path(os.environ["TMP_DIR"]).resolve()

          with zipfile.ZipFile(archive) as z:
              names = z.namelist()

              if ".github/workflows/verify.yml" not in names:
                  raise SystemExit("verify.yml esperado não está no pacote")

              forbidden = [
                  name for name in names
                  if Path(name).name == ".env"
                  or ".." in Path(name).parts
                  or Path(name).is_absolute()
              ]
              if forbidden:
                  raise SystemExit(f"entradas proibidas no ZIP: {forbidden[:10]}")

              for member in z.infolist():
                  if member.filename.startswith(".github/workflows/"):
                      continue
                  dest = (target / member.filename).resolve()
                  if target not in dest.parents and dest != target:
                      raise SystemExit(f"path traversal detectado: {member.filename}")
                  z.extract(member, target)
          PY

          test -f "$TMP_DIR/pyproject.toml"
          test -d "$TMP_DIR/app"
          test -d "$TMP_DIR/tests"

          shopt -s dotglob nullglob
          cp -a "$TMP_DIR"/* ./

          rm -f "$ARCHIVE"
          rm -f .bootstrap-trigger

      - name: publicar árvore extraída na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "plexo-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi

          git commit -m "Bootstrap Plexo backend from validated checkpoint"
          git push origin HEAD:bootstrap/plexo-project
