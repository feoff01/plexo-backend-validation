name: auditar janela ANBIMA ETTJ (temporario)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: baixar janela oficial first-party
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: baixar datas publicas via form oficial
        shell: bash
        run: |
          set -euo pipefail
          outdir="$RUNNER_TEMP/anbima-window"
          mkdir -p "$outdir"
          endpoint="https://www.anbima.com.br/informacoes/est-termo/CZ-down.asp"
          : > "$outdir/manifest.tsv"
          for item in             "2026-10-02|02/10/2026"             "2026-10-01|01/10/2026"             "2026-09-30|30/09/2026"             "2026-09-29|29/09/2026"             "2026-09-28|28/09/2026"             "2026-09-25|25/09/2026"
          do
            iso="${item%%|*}"
            br="${item#*|}"
            body="$outdir/${iso}.csv"
            headers="$outdir/${iso}.headers.txt"
            meta=$(curl --silent --show-error --location               --proto '=https' --tlsv1.2               --user-agent 'Plexo-source-audit/1.0'               --dump-header "$headers"               --output "$body"               --write-out '%{http_code}|%{content_type}'               --data-urlencode 'escolha=2'               --data-urlencode 'Idioma=PT'               --data-urlencode 'saida=csv'               --data-urlencode 'Dt_Ref_Ver=20260925'               --data-urlencode "Dt_Ref=$br"               "$endpoint")
            bytes=$(wc -c < "$body" | tr -d ' ')
            hash=$(sha256sum "$body" | awk '{print $1}')
            first_hex=$(head -c 24 "$body" | od -An -tx1 | tr -d ' \n')
            printf '%s\t%s\t%s\t%s\t%s\n' "$iso" "$meta" "$bytes" "$hash" "$first_hex" | tee -a "$outdir/manifest.tsv"
          done

      - name: publicar janela bruta oficial
        uses: actions/upload-artifact@v4
        with:
          name: anbima-ettj-official-window
          path: ${{ runner.temp }}/anbima-window
          if-no-files-found: error
          retention-days: 1
