name: materializar ANBIMA ETTJ 5d sessao (temporario)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  history:
    name: baixar janela oficial 5d com sessao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: reproduzir fluxo oficial POST + download na mesma sessao
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anbima-history"
          page="https://www.anbima.com.br/informacoes/est-termo/CZ.asp"
          download="https://www.anbima.com.br/informacoes/est-termo/CZ-down.asp"
          for d in 02/10/2026 01/10/2026 30/09/2026 29/09/2026 28/09/2026; do
            key="$(echo "$d" | tr -d '/')"
            jar="$RUNNER_TEMP/anbima-history/cookie-$key.txt"
            html="$RUNNER_TEMP/anbima-history/page-$key.html"
            out="$RUNNER_TEMP/anbima-history/ettj-$key.csv"
            hdr="$RUNNER_TEMP/anbima-history/ettj-$key.headers"
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --cookie-jar "$jar" --cookie "$jar" \
              --output "$html" \
              --data-urlencode "escolha=2" \
              --data-urlencode "Idioma=PT" \
              --data-urlencode "saida=csv" \
              --data-urlencode "Dt_Ref_Ver=20260925" \
              --data-urlencode "Dt_Ref=$d" \
              "$page"
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --cookie "$jar" \
              --dump-header "$hdr" \
              --output "$out" \
              "$download"
            echo "DATE=$d"
            grep -iE '^content-type:|^content-disposition:' "$hdr" | tail -n 2 || true
            wc -c "$out"
            sha256sum "$out"
            python - "$out" <<'PY'
          from pathlib import Path
          import sys
          b=Path(sys.argv[1]).read_bytes()
          print("PREFIX", repr(b[:90]))
          PY
          done

      - name: publicar CSVs oficiais 5d
        uses: actions/upload-artifact@v4
        with:
          name: anbima-ettj-official-history-5d-session
          path: |
            ${{ runner.temp }}/anbima-history/*.csv
            ${{ runner.temp }}/anbima-history/*.headers
          if-no-files-found: error
          retention-days: 1
