name: materializar ANBIMA ETTJ oficial (temporario)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    name: baixar CSV ETTJ first-party
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: baixar bytes oficiais sem transformar
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.anbima.com.br/informacoes/est-termo/CZ-down.asp"
          out="$RUNNER_TEMP/anbima-ettj-official.csv"
          headers="$RUNNER_TEMP/anbima-ettj-headers.txt"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --dump-header "$headers" \
            --output "$out" \
            "$url"
          test -s "$out"
          grep -iE '^content-type:.*(text/csv|application/.*csv)' "$headers"
          sha256sum "$out" | tee "$RUNNER_TEMP/anbima-ettj-sha256.txt"
          wc -c "$out" | tee "$RUNNER_TEMP/anbima-ettj-bytes.txt"
          page="$RUNNER_TEMP/cz.html"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$page" \
            "https://www.anbima.com.br/informacoes/est-termo/CZ.asp"
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag.lower()=="form":
                      print("FORM", a.get("method"), a.get("action"))
                  elif tag.lower()=="input" and (a.get("name") or a.get("value")):
                      print("INPUT", a.get("type"), a.get("name"), a.get("value"))
          P().feed(Path("$RUNNER_TEMP/cz.html").read_text(errors="replace"))
          PY

      - name: publicar bytes brutos oficiais
        uses: actions/upload-artifact@v4
        with:
          name: anbima-ettj-official-raw
          path: |
            ${{ runner.temp }}/anbima-ettj-official.csv
            ${{ runner.temp }}/anbima-ettj-headers.txt
            ${{ runner.temp }}/anbima-ettj-sha256.txt
            ${{ runner.temp }}/anbima-ettj-bytes.txt
          if-no-files-found: error
          retention-days: 1
