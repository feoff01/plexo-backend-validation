name: materializar ANBIMA ETTJ oficial (temporario)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    name: baixar CSV ETTJ first-party
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: baixar bytes oficiais sem transformar
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.anbima.com.br/informacoes/est-termo/CZ-down.asp"
          out="$RUNNER_TEMP/anbima-ettj-official.csv"
          headers="$RUNNER_TEMP/anbima-ettj-headers.txt"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --dump-header "$headers" \
            --output "$out" \
            "$url"
          test -s "$out"
          grep -iE '^content-type:.*(text/csv|application/.*csv)' "$headers"
          sha256sum "$out" | tee "$RUNNER_TEMP/anbima-ettj-sha256.txt"
          wc -c "$out" | tee "$RUNNER_TEMP/anbima-ettj-bytes.txt"

      - name: publicar bytes brutos oficiais
        uses: actions/upload-artifact@v4
        with:
          name: anbima-ettj-official-raw
          path: |
            ${{ runner.temp }}/anbima-ettj-official.csv
            ${{ runner.temp }}/anbima-ettj-headers.txt
            ${{ runner.temp }}/anbima-ettj-sha256.txt
            ${{ runner.temp }}/anbima-ettj-bytes.txt
          if-no-files-found: error
          retention-days: 1
