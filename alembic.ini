# Alembic · Synapta/Plexo
# A URL do banco NÃO fica aqui: env.py lê DATABASE_URL de plexo-backend/.env.
[alembic]
script_location = %(here)s/alembic
# alembic/ entra no sys.path para as revisions importarem sqlfile (vale para todo comando)
prepend_sys_path = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
timezone = America/Sao_Paulo
# uma transação por revision (mesma semântica do loop psql, um arquivo = uma transação)
transaction_per_migration = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
