[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexo-backend"
version = "0.1.0"
description = "Plexo — backend de agentes de IA (RCVM 19). O banco executa as regras; o LLM entende e sintetiza; o código calcula."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13", "SQLAlchemy>=2.0", "psycopg[binary,pool]>=3.1", "python-dotenv>=1.0",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3",
  "openai>=1.40", "jinja2>=3.1", "typer>=0.12", "arq>=0.26", "redis>=5.0", "pyyaml>=6.0", "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
plexo = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
